name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

jobs:
  test:
    name: pytest (Windows / Python 3.11)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen   # 无头环境运行 PyQt6 测试
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: 运行测试
        run: pytest tests/ -q --tb=short

      - name: 覆盖率报告（不阻塞）
        if: always()
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml -q --tb=short
          python -c "import xml.etree.ElementTree as ET; t=ET.parse('coverage.xml'); print(f'覆盖率: {float(t.getroot().attrib.get(\"line-rate\",0))*100:.1f}%')" 2>$null || echo "覆盖率计算跳过"

      - name: 上传覆盖率产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  lint:
    name: 语法检查 (compileall)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 全量语法编译检查
        run: |
          python -m compileall -q src tests tools scripts
          echo "✅ 语法检查通过"
