<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="applicable-device" content="pc,mobile">
<meta name="description" content="输入上次月经时间与周期，自动计算安全期、排卵期与下次月经日期。">
<meta name="keywords" content="293查询,安全期查询">
<title>安全期查询 - 293查询</title>
<link href="style/bootstrap.min.css" rel="stylesheet" type="text/css"/>
<link href="style/new.css" rel="stylesheet" type="text/css"/>
<link href="style/site.css" rel="stylesheet" type="text/css"/>
</head>
<body data-tool="anquanqi">

<div id="site-nav"></div>

<div class="container">
<section>
  <div class="tool-head">
    <img src="images/anquanqi.png" alt="安全期查询">
    <div>
      <h2>安全期查询</h2>
      <p>输入上次月经时间与周期，自动计算安全期、排卵期与下次月经日期。</p>
    </div>
  </div>

  <div class="tool-card">
    <form onsubmit="return false;">
      <div class="form-row">
        <div class="col-md-4 mb-2">
          <label>上次月经开始日期</label>
          <input type="date" id="aqLast" class="form-control">
        </div>
        <div class="col-md-3 mb-2">
          <label>月经周期（天）</label>
          <input type="number" id="aqCycle" class="form-control" value="28" min="20" max="45">
        </div>
        <div class="col-md-3 mb-2">
          <label>经期天数</label>
          <input type="number" id="aqMen" class="form-control" value="5" min="2" max="10">
        </div>
        <div class="col-md-2 mb-2" style="display:flex;align-items:flex-end">
          <button type="button" id="aqBtn" class="btn-query" style="width:100%">计算</button>
        </div>
      </div>
    </form>
    <div class="result" id="result"></div>
  </div>
</section>
</div>

<div id="site-footer"></div>

<script src="js/jquery-3.3.1.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/layout.js"></script>
<script src="js/tools.js"></script>
</body>
</html>
