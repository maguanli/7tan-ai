<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="applicable-device" content="pc,mobile">
<meta name="description" content="通过银行卡号查询该卡的相关信息，包括卡名称、银行卡卡种、卡品牌、银行卡发卡行、以及归属地等信息。">
<meta name="keywords" content="293查询,银行卡归属地查询">
<title>银行卡归属地查询 - 293查询</title>
<link href="style/bootstrap.min.css" rel="stylesheet" type="text/css"/>
<link href="style/new.css" rel="stylesheet" type="text/css"/>
<link href="style/site.css" rel="stylesheet" type="text/css"/>
</head>
<body data-tool="bank">

<div id="site-nav"></div>

<div class="container">
<section>
  <div class="tool-head">
    <img src="images/bank.png" alt="银行卡归属地查询">
    <div>
      <h2>银行卡归属地查询</h2>
      <p>通过银行卡号查询该卡的相关信息，包括卡名称、银行卡卡种、卡品牌、银行卡发卡行、以及归属地等信息。</p>
    </div>
  </div>

  <div class="tool-card">
    <form onsubmit="return false;">
      <div class="form-row">
        <div class="col-md-8 mb-2">
          <input type="text" id="bankInput" class="form-control" placeholder="请输入 12~19 位银行卡号">
        </div>
        <div class="col-md-4">
          <button type="button" id="bankBtn" class="btn-query">立即查询</button>
        </div>
      </div>
    </form>
    <div class="result" id="result"></div>
  </div>
</section>
</div>

<div id="site-footer"></div>

<script src="js/jquery-3.3.1.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/layout.js"></script>
<script src="js/tools.js"></script>
</body>
</html>
