<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="applicable-device" content="pc,mobile">
<meta name="description" content="查看域名是否已经备案及备案情况。">
<meta name="keywords" content="293查询,备案查询">
<title>备案查询 - 293查询</title>
<link href="style/bootstrap.min.css" rel="stylesheet" type="text/css"/>
<link href="style/new.css" rel="stylesheet" type="text/css"/>
<link href="style/site.css" rel="stylesheet" type="text/css"/>
</head>
<body data-tool="beian">

<div id="site-nav"></div>

<div class="container">
<section>
  <div class="tool-head">
    <img src="images/beian.png" alt="备案查询">
    <div>
      <h2>备案查询</h2>
      <p>查看域名是否已经备案及备案情况。</p>
    </div>
  </div>

  <div class="tool-card">
    <form onsubmit="return false;">
      <div class="form-row">
        <div class="col-md-8 mb-2">
          <input type="text" id="beianInput" class="form-control" placeholder="请输入域名，例如 beian.miit.gov.cn">
        </div>
        <div class="col-md-4">
          <button type="button" id="beianBtn" class="btn-query">立即查询</button>
        </div>
      </div>
    </form>
    <div class="result" id="result"></div>
  </div>
</section>
</div>

<div id="site-footer"></div>

<script src="js/jquery-3.3.1.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/layout.js"></script>
<script src="js/tools.js"></script>
</body>
</html>
