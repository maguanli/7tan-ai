<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="applicable-device" content="pc,mobile">
<meta name="description" content="查询本机IP或指定IP地址的归属地、运营商与地理位置信息。">
<meta name="keywords" content="293查询,IP查询">
<title>IP查询 - 293查询</title>
<link href="style/bootstrap.min.css" rel="stylesheet" type="text/css"/>
<link href="style/new.css" rel="stylesheet" type="text/css"/>
<link href="style/site.css" rel="stylesheet" type="text/css"/>
</head>
<body data-tool="ip">

<div id="site-nav"></div>

<div class="container">
<section>
  <div class="tool-head">
    <img src="images/ip.png" alt="IP查询">
    <div>
      <h2>IP查询</h2>
      <p>查询本机IP或指定IP地址的归属地、运营商与地理位置信息。</p>
    </div>
  </div>

  <div class="tool-card">
    <form onsubmit="return false;">
      <div class="form-row">
        <div class="col-md-8 mb-2">
          <input type="text" id="ipInput" class="form-control" placeholder="留空则查询本机IP，或输入 IPv4 / IPv6 地址">
        </div>
        <div class="col-md-4">
          <button type="button" id="ipBtn" class="btn-query">立即查询</button>
        </div>
      </div>
    </form>
    <div class="result" id="result"></div>
  </div>
</section>
</div>

<div id="site-footer"></div>

<script src="js/jquery-3.3.1.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/layout.js"></script>
<script src="js/tools.js"></script>
</body>
</html>
