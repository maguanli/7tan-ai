<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="applicable-device" content="pc,mobile">
<meta name="description" content="一键评估 QQ 号码价值，综合号码位数、靓号规律等维度给出参考估价。">
<meta name="keywords" content="293查询,QQ价格评估">
<title>QQ价格评估 - 293查询</title>
<link href="style/bootstrap.min.css" rel="stylesheet" type="text/css"/>
<link href="style/new.css" rel="stylesheet" type="text/css"/>
<link href="style/site.css" rel="stylesheet" type="text/css"/>
</head>
<body data-tool="qq">

<div id="site-nav"></div>

<div class="container">
<section>
  <div class="tool-head">
    <img src="images/qq.png" alt="QQ价格评估">
    <div>
      <h2>QQ价格评估</h2>
      <p>一键评估 QQ 号码价值，综合号码位数、靓号规律等维度给出参考估价。</p>
    </div>
  </div>

  <div class="tool-card">
    <form onsubmit="return false;">
      <div class="form-row">
        <div class="col-md-8 mb-2">
          <input type="text" id="qqInput" class="form-control" placeholder="请输入 QQ 号码，例如 10001">
        </div>
        <div class="col-md-4">
          <button type="button" id="qqBtn" class="btn-query">立即评估</button>
        </div>
      </div>
    </form>
    <div class="result" id="result"></div>
  </div>
</section>
</div>

<div id="site-footer"></div>

<script src="js/jquery-3.3.1.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/layout.js"></script>
<script src="js/tools.js"></script>
</body>
</html>
