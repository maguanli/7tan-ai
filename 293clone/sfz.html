<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="applicable-device" content="pc,mobile">
<meta name="description" content="通过身份证号码前6位查询户籍所在地区，并校验证件号码格式。">
<meta name="keywords" content="293查询,身份证查询">
<title>身份证查询 - 293查询</title>
<link href="style/bootstrap.min.css" rel="stylesheet" type="text/css"/>
<link href="style/new.css" rel="stylesheet" type="text/css"/>
<link href="style/site.css" rel="stylesheet" type="text/css"/>
</head>
<body data-tool="sfz">

<div id="site-nav"></div>

<div class="container">
<section>
  <div class="tool-head">
    <img src="images/sfz.png" alt="身份证查询">
    <div>
      <h2>身份证查询</h2>
      <p>通过身份证号码前6位查询户籍所在地区，并校验证件号码格式。</p>
    </div>
  </div>

  <div class="tool-card">
    <form onsubmit="return false;">
      <div class="form-row">
        <div class="col-md-8 mb-2">
          <input type="text" id="sfzInput" class="form-control" maxlength="18" placeholder="请输入 18 位身份证号码，例如 11010119900307xxxx">
        </div>
        <div class="col-md-4">
          <button type="button" id="sfzBtn" class="btn-query">立即查询</button>
        </div>
      </div>
    </form>
    <div class="result" id="result"></div>
  </div>
</section>
</div>

<div id="site-footer"></div>

<script src="js/jquery-3.3.1.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/layout.js"></script>
<script src="js/tools.js"></script>
</body>
</html>
