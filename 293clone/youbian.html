<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="applicable-device" content="pc,mobile">
<meta name="description" content="按省市或地区名快速查询邮政编码。">
<meta name="keywords" content="293查询,邮编查询">
<title>邮编查询 - 293查询</title>
<link href="style/bootstrap.min.css" rel="stylesheet" type="text/css"/>
<link href="style/new.css" rel="stylesheet" type="text/css"/>
<link href="style/site.css" rel="stylesheet" type="text/css"/>
</head>
<body data-tool="youbian">

<div id="site-nav"></div>

<div class="container">
<section>
  <div class="tool-head">
    <img src="images/youbian.png" alt="邮编查询">
    <div>
      <h2>邮编查询</h2>
      <p>按省市或地区名快速查询邮政编码。</p>
    </div>
  </div>

  <div class="tool-card">
    <form onsubmit="return false;">
      <div class="form-row">
        <div class="col-md-8 mb-2">
          <input type="text" id="ybInput" class="form-control" placeholder="请输入城市名或 6 位邮编，例如 杭州 或 310000">
        </div>
        <div class="col-md-4">
          <button type="button" id="ybBtn" class="btn-query">立即查询</button>
        </div>
      </div>
    </form>
    <div class="result" id="result"></div>
  </div>
</section>
</div>

<div id="site-footer"></div>

<script src="js/jquery-3.3.1.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/layout.js"></script>
<script src="js/tools.js"></script>
</body>
</html>
