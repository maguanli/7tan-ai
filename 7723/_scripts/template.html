<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#eef2f7;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#1f2937}
.page{width:1000px;margin:0 auto;background:#fff}
header{background:linear-gradient(135deg,#1e3a8a,#2563eb 60%,#3b82f6);color:#fff;padding:52px 56px 44px}
header .badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:5px 16px;font-size:14px;letter-spacing:2px}
header h1{font-size:52px;margin:18px 0 10px;letter-spacing:4px}
header .sub{font-size:17px;line-height:1.7;opacity:.95}
header .src{margin-top:14px;font-size:13px;opacity:.75}
.stats{display:flex;gap:0;border-bottom:1px solid #e5e7eb}
.stat{flex:1;text-align:center;padding:22px 8px;border-right:1px solid #eef2f7}
.stat:last-child{border-right:none}
.stat b{display:block;font-size:28px;color:#2563eb}
.stat span{font-size:13px;color:#6b7280}
.timeline{position:relative;padding:30px 56px 50px}
.timeline:before{content:"";position:absolute;left:78px;top:40px;bottom:60px;width:2px;background:#dbeafe}
.yr{position:relative;margin:26px 0 14px}
.yr span{display:inline-block;background:#1e3a8a;color:#fff;font-size:20px;font-weight:700;padding:6px 22px;border-radius:8px;letter-spacing:3px}
.item{position:relative;padding-left:52px;margin:18px 0 26px}
.dot{position:absolute;left:20px;top:22px;width:14px;height:14px;background:#fff;border:3px solid #2563eb;border-radius:50%;z-index:2}
.card{background:#f8fafc;border:1px solid #e2e8f0;border-left:4px solid #2563eb;border-radius:12px;padding:18px 20px}
.chead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.date{font-size:14px;color:#2563eb;font-weight:700}
.board{font-size:12px;background:#e0edff;color:#1d4ed8;border-radius:10px;padding:2px 10px}
.card h3{font-size:19px;color:#0f172a;margin:2px 0 6px}
.meta{font-size:12px;color:#94a3b8;margin-bottom:10px}
.content{font-size:14.5px;line-height:1.85;color:#374151;background:#fff;border-radius:8px;padding:12px 14px;border:1px solid #eef2f7}
.reps{margin-top:10px}
.rep{font-size:13px;line-height:1.7;padding:6px 0;border-top:1px dashed #e2e8f0}
.rep b{color:#1d4ed8;margin-right:6px}
.rep .rt{color:#9ca3af;font-size:11px;margin-right:8px}
.rep .rx{color:#4b5563}
footer{background:#0f172a;color:#cbd5e1;text-align:center;padding:26px;font-size:13px;line-height:1.9}
</style></head><body><div class="page">
<header>
  <div class="badge">2009 — 2015</div>
  <h1>7723(7坛) 大事记</h1>
  <div class="sub">从一个人的 WAP 手机游戏网，做到「百度第一」的破解游戏站；<br>从一个人的站，到一群人的「七坛」。</div>
  <div class="src">依据主站数据库（bbs）原样整理 · 主题 54,230 · 回复 412,632 · 注册记录 52,755</div>
</header>
<div class="stats">
  <div class="stat"><b>54230</b><span>论坛主题</span></div>
  <div class="stat"><b>412632</b><span>网友回复</span></div>
  <div class="stat"><b>52755</b><span>注册记录</span></div>
  <div class="stat"><b>11</b><span>论坛版块</span></div>
  <div class="stat"><b>2009-2015</b><span>活跃年代</span></div>
</div>
<div class="timeline">
<!--CARDS-->
</div>
<footer>7723(7坛) 大事记 · 帖子与回复均取自当年论坛数据库原文<br>「有爱有品有梦，你我的 7723。」</footer>
</div></body></html>
