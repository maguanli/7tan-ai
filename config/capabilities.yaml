# ============================================================
# 盘古 AI — 功能与能力清单
# 此文件同时用于：
#   1. 设置页「🧠 能力清单」Tab 展示
#   2. AI System Prompt 能力概览
# ============================================================

capabilities:
  - category: "🌐 浏览器与网页"
    icon: "🌐"
    items:
      - { name: "浏览网页", desc: "在源站/管理后台打开任意网页，读取页面文字、链接和图片", tool: "browse_page" }
      - { name: "点击 & 滚动", desc: "模拟点击按钮、链接，滚动懒加载页面", tool: "click_element / scroll_down" }
      - { name: "截图 & OCR", desc: "对网页截图保存，OCR 识别图片中的文字", tool: "screenshot / ocr_screenshot" }
      - { name: "提取图片/LOGO", desc: "自动识别页面中的游戏LOGO、截图等图片资源", tool: "get_page_images / extract_logo" }
      - { name: "查找下载链接", desc: "自动识别页面中的 APK/IPA/ZIP/RAR/EXE 等安装包链接", tool: "find_download_links" }

  - category: "📁 文件操作"
    icon: "📁"
    items:
      - { name: "下载文件", desc: "支持断点续传、伪装搜索引擎蜘蛛下载", tool: "download_file" }
      - { name: "读写文件", desc: "读取文本/JSON/代码，写入文本或二进制文件", tool: "read_file_content / write_file" }
      - { name: "目录管理", desc: "列出目录文件、删除文件/目录", tool: "list_files / delete_file" }
      - { name: "图片压缩", desc: "压缩 LOGO/截图，调整尺寸和质量", tool: "compress_image" }
      - { name: "磁盘检查", desc: "检查磁盘剩余空间，下载前自动确认", tool: "check_disk" }

  - category: "🎮 游戏内容处理"
    icon: "🎮"
    items:
      - { name: "游戏深度分析", desc: "分析游戏玩法/画面/剧情，生成结构化评测报告", tool: "analyze_game" }
      - { name: "游戏对比", desc: "对比两款游戏的差异，输出竞品分析", tool: "compare_games" }
      - { name: "用户评价汇总", desc: "提取正面/负面评价关键词和主题", tool: "summarize_reviews" }
      - { name: "撰写游戏简介", desc: "自动生成 HTML 格式专业游戏简介（150-300字）", tool: "cloud_write_intro" }
      - { name: "翻译（英→中）", desc: "将英文游戏介绍翻译为中文", tool: "translate_text" }
      - { name: "敏感词检查", desc: "发布前审核内容是否包含违规词汇", tool: "check_sensitive_words" }
      - { name: "内容质量检查", desc: "检查简介长度、截图数量是否达标", tool: "check_content_quality" }

  - category: "📤 发布与存储"
    icon: "📤"
    items:
      - { name: "发布到7坛", desc: "自动填写表单、上传LOGO/截图、提交发布", tool: "publish_to_7tan" }
      - { name: "OSS云存储", desc: "上传/删除文件到云存储，返回外链URL，大文件自动分片", tool: "oss_upload / oss_delete" }
      - { name: "表单检测", desc: "自动识别页面所有表单字段及类型", tool: "detect_form_fields" }
      - { name: "批量填表", desc: "一次性填写发布表单所有字段", tool: "fill_all_fields" }

  - category: "🗄️ 数据库"
    icon: "🗄️"
    items:
      - { name: "资源查重", desc: "按源站ID检查资源是否已存在，避免重复发布", tool: "db_check_duplicate" }
      - { name: "资源存取", desc: "保存/查询/更新资源信息到数据库", tool: "db_save_resource / db_query_resources" }
      - { name: "版本比对", desc: "检查是否已有更早版本，实现增量更新", tool: "db_check_version" }
      - { name: "任务日志", desc: "记录浏览/下载/改写/上传/发布各环节日志", tool: "db_add_task_log" }

  - category: "🧠 AI 推理能力"
    icon: "🧠"
    items:
      - { name: "深度分析", desc: "单独调用大模型进行深度推理，适合复杂任务", tool: "cloud_analyze" }
      - { name: "互联网搜索", desc: "搜索最新游戏资讯、攻略、补丁、新闻", tool: "web_search" }
      - { name: "行业新闻", desc: "获取最新游戏行业动态、新游上线、版本更新", tool: "fetch_news" }
      - { name: "推理框架", desc: "复杂任务自动启用：拆解→多角度→预判→验证→反思", tool: "内置能力" }

  - category: "🔧 自我管理"
    icon: "🔧"
    items:
      - { name: "修改配置", desc: "安全修改 config.yaml，带审计日志", tool: "self_modify_config" }
      - { name: "更新提示词", desc: "优化自己的 system prompt 或子任务模板", tool: "self_update_prompt" }
      - { name: "创建插件", desc: "动态编写并注册新插件，扩展自身能力", tool: "create_plugin" }
      - { name: "沙盒执行", desc: "在安全沙盒中运行 Python 代码，验证自身逻辑", tool: "sandbox_execute" }
      - { name: "自建重启", desc: "重新构建项目、重启自身进程", tool: "self_rebuild / self_restart" }
      - { name: "完整性验证", desc: "校验所有关键文件 SHA-256 是否一致", tool: "verify_integrity" }
      - { name: "健康检查", desc: "检查数据库、浏览器、网络、磁盘状态", tool: "health_check" }
      - { name: "记忆系统", desc: "持久化存储/召回/管理知识和经验", tool: "memory_store / memory_recall" }

  - category: "💻 开发运维"
    icon: "💻"
    items:
      - { name: "Git 全系列", desc: "init/clone/add/commit/push/pull/branch/checkout/stash/tag/log/diff/remote", tool: "git_* (20+ 工具)" }
      - { name: "Docker 管理", desc: "容器/镜像/构建/日志/compose/prune 全生命周期", tool: "docker_* (8 工具)" }
      - { name: "Kubernetes", desc: "pods/svc/deploy/events/logs/exec/scale/rollout/helm", tool: "kubectl_* (15+ 工具)" }
      - { name: "VS Code 集成", desc: "打开文件/项目、对比差异、安装扩展", tool: "vscode_* (7 工具)" }
      - { name: "Android 调试", desc: "ADB 设备管理、安装/卸载APK、截图、Shell", tool: "adb_* (6 工具)" }
      - { name: "远程部署", desc: "SSH执行命令、SCP上传、rsync同步", tool: "ssh_execute / scp_upload / rsync_deploy" }
      - { name: "Gradle 构建", desc: "执行 Gradle 构建任务，支持 Android 打包", tool: "gradle_build" }
      - { name: "代码审查", desc: "静态分析代码质量、安全漏洞扫描", tool: "code_review_* / security_scan_*" }
      - { name: "LSP 语言服务", desc: "跳转定义/查找引用/诊断检查/代码补全/悬停文档，基于 jedi+pyflakes", tool: "go_to_definition / find_all_references / get_diagnostics / get_completions / get_hover_info" }

  - category: "🎬 视频制作"
    icon: "🎬"
    items:
      - { name: "Edge TTS 配音", desc: "微软免费语音合成，十几种中文音色", tool: "Edge TTS (G盘本地)" }
      - { name: "MoviePy 合成", desc: "图片+配音+字幕+转场 合成视频", tool: "MoviePy (G盘本地)" }
      - { name: "FFmpeg 处理", desc: "视频编解码、格式转换、音视频合并", tool: "FFmpeg (G盘本地)" }
      - { name: "Pillow 图像", desc: "程序化生成画面（几何图形/文字/特效）", tool: "Pillow (G盘本地)" }
      - { name: "SD WebUI", desc: "AI 文生图，生成真人/动漫风格画面（需手动操作）", tool: "G:/AI_Video/stable-diffusion-webui" }
      - { name: "ComfyUI", desc: "AI 工作流生图/生视频（已克隆，待初始化）", tool: "G:/AI_Tools/ComfyUI" }

  - category: "📊 费用管理"
    icon: "📊"
    items:
      - { name: "费用记录", desc: "每次调用 AI 模型后自动记录 token 和费用", tool: "track_cost" }
      - { name: "费用报告", desc: "按日期/任务类型汇总费用统计", tool: "get_cost_report" }

