<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>公众号 LOGO 候选预览 - 大起大落的一生</title>
<style>
  body { background:#f4f2ee; font-family:"Microsoft YaHei", sans-serif; padding:40px; }
  h1 { text-align:center; color:#2b4c7e; }
  p.desc { text-align:center; color:#888; margin-bottom:40px; }
  .row { display:flex; justify-content:center; gap:60px; flex-wrap:wrap; }
  .card { background:#fff; border-radius:16px; padding:28px 34px 24px; box-shadow:0 6px 24px rgba(0,0,0,.08); text-align:center; width:300px; }
  .card img { width:220px; height:220px; border-radius:50%; box-shadow:0 4px 16px rgba(0,0,0,.18); }
  .card h2 { margin:18px 0 6px; color:#333; }
  .card p { color:#777; font-size:14px; line-height:1.7; }
  .tag { display:inline-block; background:#eef4ff; color:#2b4c7e; border-radius:20px; padding:3px 14px; font-size:13px; margin-top:6px; }
  .foot { text-align:center; color:#aaa; margin-top:40px; font-size:13px; }
</style>
</head>
<body>
<h1>「大起大落的一生」公众号 LOGO</h1>
<p class="desc">圆形头像实际效果预览 · 左：方案A 星辉之路 / 右：方案B 旭日人生</p>

<div class="row">
  <div class="card">
    <img src="logo_final_A.png" alt="方案A 星辉之路">
    <h2>方案A · 星辉之路</h2>
    <p>深蓝夜空 · 金色人生曲线 · 登顶小人 · 谷底金星<br>寓意：人生起落，低谷有星，终登顶峰</p>
    <span class="tag">深蓝金 · 高级感 · 现代</span>
  </div>
  <div class="card">
    <img src="logo_final_B.png" alt="方案B 旭日人生">
    <h2>方案B · 旭日人生</h2>
    <p>暖橙日出 · 低山到高山 · 旗帜登顶 · 起点橙点<br>寓意：从低处出发，一步步登顶</p>
    <span class="tag">暖橙白 · 温暖 · 大气</span>
  </div>
</div>

<div class="foot">800×800 高清版 + 360×360 公众号头像版已就绪（logo_final_A/B_360.png）</div>
</body>
</html>
