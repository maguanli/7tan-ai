<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红色警戒 · 重制版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#0a0e14;
  font-family:"Microsoft YaHei","Segoe UI",sans-serif;
  color:#cfd6e4;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
#wrap{
  display:flex;
  width:100vw;height:100vh;
  padding:6px;gap:6px;
  background:
    radial-gradient(1200px 500px at 20% -10%, rgba(40,70,110,.25), transparent 60%),
    #0a0e14;
}
/* ========== 主战场 ========== */
#gameArea{
  position:relative;flex:1;min-width:0;
  border-radius:8px;overflow:hidden;
  border:1px solid #26303f;
  box-shadow:0 0 30px rgba(0,0,0,.6), inset 0 0 80px rgba(0,0,0,.3);
  background:#12202e;
}
canvas#main{display:block;width:100%;height:100%;cursor:crosshair}
#topBar{
  position:absolute;top:8px;left:8px;right:8px;
  display:flex;gap:8px;pointer-events:none;z-index:5;
}
.tb{
  background:linear-gradient(180deg, rgba(16,22,32,.92), rgba(10,14,22,.94));
  border:1px solid #2c3a4e;
  border-radius:8px;
  padding:5px 14px;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 14px rgba(0,0,0,.5);
}
.tb .ic{font-size:16px}
.tb .lbl{font-size:10px;color:#7c8aa0;letter-spacing:1px}
.tb .val{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.tb .val.gold{color:#ffd34d;text-shadow:0 0 12px rgba(255,211,77,.35)}
.tb .val.pop{color:#6fd8ff;text-shadow:0 0 12px rgba(111,216,255,.3)}
.tb .val.kill{color:#ff7a6b}
/* ========== 右侧面板 ========== */
#panel{
  width:212px;flex-shrink:0;
  display:flex;flex-direction:column;gap:6px;
  overflow:hidden;
}
.pc{
  background:linear-gradient(180deg, #141b28, #0e1420);
  border:1px solid #26303f;border-radius:8px;
  padding:8px;box-shadow:0 4px 14px rgba(0,0,0,.4);
}
.pt{
  text-align:center;font-size:15px;font-weight:900;letter-spacing:4px;
  background:linear-gradient(135deg,#ffd34d,#ff9d3d);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  padding-bottom:6px;margin-bottom:6px;
  border-bottom:1px solid #26303f;
}
.st{
  font-size:10px;color:#6f7f97;letter-spacing:2px;font-weight:700;
  margin:8px 0 4px;text-transform:uppercase;
}
.bt{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px;margin-top:4px;
  border:1px solid #2e3b52;border-radius:6px;
  background:linear-gradient(180deg,#1b2434,#141c2a);
  color:#cfd6e4;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .12s;font-family:inherit;
}
.bt:hover{border-color:#4a6a9a;background:linear-gradient(180deg,#24304a,#1a2436);transform:translateY(-1px);box-shadow:0 4px 12px rgba(40,80,140,.25)}
.bt:active{transform:translateY(0);filter:brightness(.8)}
.bt .price{color:#ffd34d;font-weight:800}
.bt .extra{font-size:10px;color:#6f7f97}
.bt.off{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
/* 小地图 */
#mw{height:92px;border:1px solid #26303f;border-radius:6px;overflow:hidden;cursor:pointer;background:#0a0f18}
#mn{width:100%;height:100%;image-rendering:pixelated;display:block}
/* 选中信息 */
#si{
  font-size:12px;line-height:1.5;min-height:44px;
  background:#0a0f18;border:1px solid #1e2836;border-radius:6px;padding:7px;
}
#si .nm{font-weight:800;font-size:13px}
#si .nm.blue{color:#6fd8ff}
#si .nm.red{color:#ff7a6b}
#si .bar{height:5px;border-radius:3px;background:#18202e;margin:4px 0;overflow:hidden}
#si .bar>div{height:100%;border-radius:3px;transition:width .15s}
#lg{
  flex:1;min-height:40px;overflow-y:auto;font-size:11px;line-height:1.55;
  background:#0a0f18;border:1px solid #1e2836;border-radius:6px;padding:6px;
  color:#8fa0b8;
}
#lg::-webkit-scrollbar,#panel::-webkit-scrollbar{width:4px}
#lg::-webkit-scrollbar-thumb{background:#2c3a4e;border-radius:2px}
#lg .g{color:#8ee06a}
#lg .b{color:#ff7a6b}
#lg .i{color:#ffd34d}
#hi{font-size:10px;color:#5a6a82;text-align:center;padding:2px 0}
/* 结束遮罩 */
#ov{
  position:absolute;inset:0;display:none;z-index:50;
  align-items:center;justify-content:center;
  background:rgba(4,6,10,.86);backdrop-filter:blur(3px);
}
#ov.show{display:flex}
#ov .bx{
  text-align:center;padding:34px 56px;border-radius:14px;
  background:linear-gradient(180deg,#16202e,#0c1119);
  border:1px solid #3a4a66;box-shadow:0 20px 60px rgba(0,0,0,.8);
}
#ov h2{font-size:30px;letter-spacing:6px;margin-bottom:10px;
  background:linear-gradient(135deg,#ff7a6b,#ffd34d);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
#ov p{color:#8fa0b8;margin-bottom:18px}
#ov button{
  padding:10px 36px;font-size:15px;font-weight:800;letter-spacing:2px;
  background:linear-gradient(135deg,#ff9d3d,#e05a2a);color:#fff;
  border:none;border-radius:8px;cursor:pointer;font-family:inherit;
  box-shadow:0 6px 20px rgba(224,90,42,.4);
}
#ov button:hover{filter:brightness(1.15);transform:translateY(-1px)}
</style>
</head>
<body>
<div id="wrap">
  <!-- 主战场 -->
  <div id="gameArea">
    <canvas id="main"></canvas>
    <div id="topBar">
      <div class="tb"><span class="ic">💰</span><div><div class="lbl">资金</div><div class="val gold" id="hGold">1000</div></div></div>
      <div class="tb"><span class="ic">👥</span><div><div class="lbl">人口</div><div class="val pop" id="hPop">0/50</div></div></div>
      <div class="tb"><span class="ic">🏰</span><div><div class="lbl">基地</div><div class="val" id="hHq">100%</div></div></div>
      <div class="tb"><span class="ic">⚔️</span><div><div class="lbl">摧毁敌军</div><div class="val kill" id="hKill">0</div></div></div>
    </div>
    <div id="ov"><div class="bx"><h2 id="ot">游戏结束</h2><p id="om"></p><button onclick="location.reload()">重新开始</button></div></div>
  </div>

  <!-- 右侧面板 -->
  <div id="panel">
    <div class="pc"><div class="pt">⚔ 红色警戒</div>
      <div class="st">🏗 建造</div>
      <button class="bt" id="btnBarracks" onclick="cmd('bB')"><span>兵营</span><span class="price">200</span><span class="extra">+20人口</span></button>
      <button class="bt" id="btnTower" onclick="cmd('bT')"><span>防御塔</span><span class="price">150</span></button>
      <button class="bt" id="btnFactory" onclick="cmd('bF')"><span>坦克工厂</span><span class="price">350</span></button>
      <div class="st">🎖 训练</div>
      <button class="bt" id="btnWorker" onclick="cmd('tW')"><span>矿工</span><span class="price">50</span><span class="extra">自动采矿</span></button>
      <button class="bt" id="btnSoldier" onclick="cmd('tS')"><span>士兵</span><span class="price">100</span></button>
      <button class="bt" id="btnRocket" onclick="cmd('tR')"><span>火箭兵</span><span class="price">150</span></button>
      <button class="bt" id="btnTank" onclick="cmd('tK')"><span>坦克</span><span class="price">250</span></button>
    </div>
    <div class="pc"><div class="st">🎮 指挥</div>
      <button class="bt" onclick="cmd('aS')"><span>全选战斗单位</span><span class="extra">双击选同类</span></button>
      <button class="bt" onclick="cmd('halt')"><span>停止</span><span class="extra">Esc</span></button>
      <div style="margin-top:6px"><div id="mw"><canvas id="mn"></canvas></div></div>
      <div id="hi">左键选择 · 右键移动/攻击 · WASD滚屏 · 滚轮缩放 · R重开</div>
    </div>
    <div class="pc"><div id="si">点击单位查看详情</div></div>
    <div class="pc" style="display:flex;flex-direction:column;flex:1;min-height:0"><div class="st">📡 情报</div><div id="lg"></div></div>
  </div>
</div>
<script src="game.js"></script>
<script src="render.js"></script>
</body>
</html>
